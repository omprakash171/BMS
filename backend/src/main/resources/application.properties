# Server (8080 is used by another service on this machine, so we use 8081.
# Cloud platforms like Render inject PORT, which we read here.)
server.port=${PORT:8081}

# H2 Database (file-based locally; platforms can override with JDBC_URL)
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/bankdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings (override JWT_SECRET via environment in production)
app.jwt.secret=${JWT_SECRET:9d4b2f6c8a1e3d5f7b9c2e4a6d8f1b3c5e7a9d2f4b6c8e1a3d5f7b9c2e4a6d8=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: comma-separated origins the React app may be served from
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

spring.application.name=bank-management
